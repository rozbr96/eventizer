services:
  api:
    image: node:24.19
    working_dir: /app
    command: sh -c "npm install && npx prisma db push && npm run build && npm start"
    env_file:
      - .env.api
    volumes:
      - ./back:/app
      - api_node_modules:/app/node_modules
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:24.19
    working_dir: /app
    command: sh -c "npm install && npm run build && npm run start -- -H 0.0.0.0"
    env_file:
      - .env.web
    volumes:
      - ./front:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    expose:
      - "4000"
    depends_on:
      - api

  nginx:
    image: nginx:1.29
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
      - mailcatcher

  db:
    image: postgres:18
    restart: always
    env_file:
      - .env.db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventizer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mailcatcher:
    image: dockage/mailcatcher
    restart: always
    expose:
      - "1080"

volumes:
  api_node_modules:
  web_node_modules:
  web_next:
  postgres_data:
  redis_data:
